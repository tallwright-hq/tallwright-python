# Apache-2.0: the license text and the NOTICE are beside this file, and the wheel carries both.
[build-system]
# Pinned deliberately: an unpinned backend is resolved fresh from the index on every build, so the
# metadata of the wheel would be whatever hatchling shipped that morning, and two builds of one commit
# could differ. The pin is a decision, and the build tools are hash-pinned beside it.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tallwright-core"
version = "0.1.0"
description = "Tallwright - shared record schema, content-addressing, and RFC 6962 Merkle primitives"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tallwright" }]
keywords = ["ai-agents", "audit", "tamper-evident", "compliance", "forensics", "merkle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2,<3",
    "rfc8785>=0.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tallwright_core"]
